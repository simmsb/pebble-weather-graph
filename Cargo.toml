cargo-features = ["panic-immediate-abort"]

[package]
name = "pebble-weather-graph"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
gravel.path = "./gravel/gravel"
gravel-sys.path = "./gravel/gravel-sys"
heapless = { version = "0.9", default-features = false, features = ["ufmt"] }
static_cell = "2"
paste = "1.0.15"
micropb = { version = "0.6.0", default-features = false, features = ["container-heapless-0-9", "decode"] }
ufmt = { version = "0.2.0", default-features = false }
pin-init = { git = "https://github.com/Rust-for-Linux/pin-init", version = "0.3.0", default-features = false }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = 'thin' # true/fat breaks defmt?
opt-level = 's'
overflow-checks = true
# panic = 'unwind'
# panic = 'immediate-abort'
panic = 'abort'

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
# panic = 'unwind'
panic = 'immediate-abort'
strip = true

[build-dependencies]
micropb-gen = "0.6.0"

[features]
default = ["logging"]
logging = []
