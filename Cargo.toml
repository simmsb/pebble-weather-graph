cargo-features = ["panic-immediate-abort"]

[package]
name = "pebble-weather-graph"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
heapless = { version = "0.9", default-features = false, features = ["ufmt"] }
paste = "1.0.15"
micropb = { version = "0.6.0", default-features = false, features = ["container-heapless-0-9", "decode"] }
ufmt = { version = "0.2.0", default-features = false }
pin-init = { git = "https://github.com/Rust-for-Linux/pin-init", version = "0.3.0", default-features = false, features = ["unsafe-pinned"] }
futures = { version = "0.3.32", default-features = false }
# pebble-async = { git = "https://github.com/simmsb/pebble-rust-async", version = "0.1.0", default-features = false }
pebble-async = { path = "../pebble-rust-async", version = "0.1.0", default-features = false }
embassy-executor = { version = "0.10.0", default-features = false, features = ["nightly", "embassy-time-driver"] }
embassy-futures = { version = "0.1.2", default-features = false }
static_cell = { version = "2.1.1", features = ["nightly"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = 'thin' # true/fat breaks defmt?
opt-level = 's'
overflow-checks = true
# panic = 'unwind'
# panic = 'immediate-abort'
panic = 'abort'

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
panic = 'abort'
# panic = 'immediate-abort'
strip = true

[build-dependencies]
micropb-gen = "0.6.0"

[features]
default = ["logging"]
logging = ["pebble-async/logging"]

[patch.crates-io]
ufmt = { git = "https://github.com/simmsb/ufmt" }
ufmt-macros = { git = "https://github.com/simmsb/ufmt" }
ufmt-write = { git = "https://github.com/simmsb/ufmt" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy" }
embassy-time = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy" }
